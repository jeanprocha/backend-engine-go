openapi: 3.0.3
info:
  title: TribIA backend-engine-go API (subconjunto documentado)
  version: "0.1.0"
  description: |
    Contrato HTTP **minimo** para integracao e expectativa de estabilidade. O servidor Go expõe rotas adicionais
    (classificacao, RAG, historico, empresas, PLG, etc.) não listadas aqui.

    **Politica de versao (2026):**
    - As rotas documentadas (`GET /health`, `POST /simulations`, `GET /law/corpus`, `GET /engine/validation`) mantêm-se **sem** prefixo `/v1/` na implementacao actual.
    - Alteracoes **incompatíveis** em formato de pedido/resposta ou semantica de campos devem ser anunciadas e, quando aplicavel,
      introduzir novas rotas com prefixo de versao (ex.: `/v2/simulations`) em paralelo com um periodo de transicao documentado.
    - O historico de simulacoes persistido no cliente deve assumir que **valores** devolvidos pelo motor podem evoluir com regras fiscais
      versionadas por periodo; mudancas de **contrato JSON** seguem a politica acima.

servers:
  - url: http://localhost:8080
    description: Desenvolvimento local (default)

paths:
  /health:
    get:
      summary: Liveness e estado basico
      operationId: getHealth
      responses:
        "200":
          description: Servidor e dependencias consultaveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /law/corpus:
    get:
      summary: Corpus normativo realmente ingerido (documentos, data-base, changelog factual)
      operationId: getLawCorpus
      description: |
        Pública (rate limiter, sem autenticação). Reporta o que ESTÁ ingerido em
        tax_law_chunks — nunca release notes inventadas. current_document_id é o
        documento com mais chunks, salvo override por LAW_CORPUS_CURRENT_SOURCE.
        Corpus vazio devolve arrays vazios (nunca null).
      responses:
        "200":
          description: Corpus normativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LawCorpusResponse"

  /engine/validation:
    get:
      summary: Validação do motor de cálculo contra a Calculadora oficial da RFB (W7/B2.1-B2.3)
      operationId: getEngineValidation
      description: |
        Pública (rate limiter, sem autenticação). Reporta o que a última execução
        da suíte cruzada REALMENTE mostrou — nunca uma afirmação inventada.
        validated só é true com pelo menos 1 caso executado, zero divergências,
        a versão da Calculadora RFB carimbada na evidência e a tabela de
        transição inalterada desde a execução; sem evidência gravada, reference
        vem vazia e cases:[] (nunca null).
      responses:
        "200":
          description: Estado de validação do motor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineValidationResponse"

  /simulations:
    post:
      summary: Simulacao tributaria (regime actual vs projetado)
      operationId: postSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationRequest"
      responses:
        "200":
          description: Resultado determinístico do motor (valores monetarios como strings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResponse"
        "400":
          description: Payload invalido (DTO na fronteira)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Erro interno; `request_id` para correlacao com logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          example: ok
        db:
          type: string
          example: ok

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensagem segura para o cliente (sem stack trace)
        code:
          type: string
          description: Codigo opcional (ex. quotas PLG)
        limit:
          type: integer
        used:
          type: integer
        plan:
          type: string
        request_id:
          type: string
          description: Correlaciona com logs estruturados no servidor (suporte)

    LawCorpusDocument:
      type: object
      required: [id, label, version, published_at, source_url]
      properties:
        id:
          type: string
          example: lc68-2024
        label:
          type: string
          example: "LC 68/2024"
        version:
          type: string
          description: structure_version dos metadados de ingestão (não é versão da lei)
        published_at:
          type: string
          description: Data-base ISO (YYYY-MM-DD) do documento realmente ingerido
        source_url:
          type: string
        chunk_prefix:
          type: string
          description: Prefixo do article_id dos chunks deste documento (ex. "lc68_")

    LawCorpusChangelogEntry:
      type: object
      required: [type, label, desc]
      properties:
        type:
          type: string
          enum: [rule, ia]
        label:
          type: string
        desc:
          type: string
          description: Fato de indexação (ex. "N trechos, data-base DD/MM/AAAA") — nunca prosa inventada

    LawCorpusResponse:
      type: object
      required: [documents, current_document_id, changelog]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/LawCorpusDocument"
        current_document_id:
          type: string
        changelog:
          type: array
          items:
            $ref: "#/components/schemas/LawCorpusChangelogEntry"

    EngineValidationCase:
      type: object
      required: [year, cbs_tribia, cbs_rfb, ibs_tribia, ibs_rfb, divergente]
      properties:
        year:
          type: integer
        cbs_tribia:
          type: string
        cbs_rfb:
          type: string
        ibs_tribia:
          type: string
        ibs_rfb:
          type: string
        divergente:
          type: boolean

    EngineValidationReference:
      type: object
      properties:
        name:
          type: string
          example: "Calculadora de Tributos RFB/Serpro"
        url:
          type: string
        version:
          type: string
          description: >-
            Versão da Calculadora RFB contra a qual a suíte rodou. A calculadora
            é beta e muda de versão, por isso a evidência a carimba e o selo do
            dossiê diz "validado contra a versão X", nunca só "validado".
            Presente sempre que validated é true — sem versão não há validated.
          example: "1.0.0-beta"
        run_at:
          type: string
          description: ISO 8601 — quando a suíte cruzada foi executada pela última vez

    EngineValidationResponse:
      type: object
      required: [validated, reference, scope, out_of_scope, cases, cases_total, cases_divergent]
      properties:
        validated:
          type: boolean
          description: >-
            Só true com pelo menos 1 caso executado, zero divergências,
            reference.version presente e a tabela de transição inalterada
            desde que a evidência foi gravada
        reference:
          $ref: "#/components/schemas/EngineValidationReference"
        scope:
          type: array
          items:
            type: string
          description: O que foi comparado (ex. "CBS", "IBS", "regime regular (empresa de serviços)")
        out_of_scope:
          type: array
          items:
            type: string
          description: O que NÃO foi comparado — ICMS/IPI/IS não são modelados pelo motor
        tolerance_brl:
          type: string
        cases:
          type: array
          items:
            $ref: "#/components/schemas/EngineValidationCase"
        cases_total:
          type: integer
        cases_divergent:
          type: integer

    ServiceInput:
      type: object
      required: [description, amount, iss_rate]
      properties:
        description:
          type: string
        amount:
          type: string
          description: Decimal canónico em string (ex. "10000.00")
        iss_rate:
          type: string
        regime_type:
          type: string

    ExpenseInput:
      type: object
      required: [description, amount, is_eligible]
      properties:
        description:
          type: string
        amount:
          type: string
        is_eligible:
          type: boolean
        regime_type:
          type: string
        legal_base:
          type: string
          description: >-
            Citação do RAG que já embasou a classificação desta despesa
            (passthrough — o motor não interpreta nem valida; vazio quando a
            IA não citou nada). Etapa C/PR5.

    SimulationRequest:
      type: object
      required: [year, services, expenses]
      properties:
        year:
          type: integer
        company_regime:
          type: string
        company_context:
          type: string
        imobiliario_redutor_ajuste_brl:
          type: string
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceInput"
        expenses:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseInput"

    TaxComponentsResponse:
      type: object
      description: >-
        Decomposição do bruto por tributo (W7/B2.1). A soma pode divergir de
        gross_tax em até R$ 0,01 por arredondamento independente de cada
        campo — não é erro. Zerada (não ausente) em regimes sem decomposição
        natural (MEI, Simples, imobiliário).
      required: [pis, cofins, iss, cbs, ibs]
      properties:
        pis:
          type: string
        cofins:
          type: string
        iss:
          type: string
        cbs:
          type: string
        ibs:
          type: string

    CalculationStepInputResponse:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string
          description: Precisão total — não arredondado a 2 casas.

    CalculationStepResponse:
      type: object
      description: >-
        Um passo da memória de cálculo (W2/PR1-2) — fórmula legível e
        operandos nomeados o suficiente para reproduzir output à mão.
      required: [label, formula, output, rounded]
      properties:
        item:
          type: string
          description: Serviço/despesa a que este passo se refere; ausente para um agregado.
        label:
          type: string
        formula:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/CalculationStepInputResponse"
        output:
          type: string
          description: Precisão total — não arredondado a 2 casas.
        rounded:
          type: boolean
          description: true quando output foi arredondado como parte deste passo.

    TaxBreakdownResponse:
      type: object
      required: [gross_tax, credits, net_tax, components]
      properties:
        gross_tax:
          type: string
        credits:
          type: string
        net_tax:
          type: string
        components:
          $ref: "#/components/schemas/TaxComponentsResponse"
        trace:
          type: array
          description: Ausente em registro salvo antes do W2/PR1-2 (compatibilidade retroativa).
          items:
            $ref: "#/components/schemas/CalculationStepResponse"

    SimulationResponse:
      type: object
      required: [year, current, projected, delta, delta_pct]
      properties:
        year:
          type: integer
        company_regime:
          type: string
          description: Valor bruto enviado pelo cliente — pode ser vazio.
        regime:
          type: string
          description: >-
            Ramo do motor que produziu este resultado (ex.: "regular" para
            entrada vazia) — NUNCA o valor bruto de company_regime acima.
            Ausente em registro salvo antes do W2/PR2.
        current:
          $ref: "#/components/schemas/TaxBreakdownResponse"
        projected:
          $ref: "#/components/schemas/TaxBreakdownResponse"
        delta:
          type: string
        delta_pct:
          type: string
        strategy_insight:
          type: string
        revenue_total:
          type: string
        overlap_model:
          type: string
        transition_series:
          type: array
          items:
            type: object
        credit_leaks:
          type: array
          items:
            type: object
        transition_series_enriched:
          type: boolean
